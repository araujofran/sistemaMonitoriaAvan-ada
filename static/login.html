<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Entrar · Regex Intelligence</title><link rel="stylesheet" href="/static/auth.css"></head><body class="auth"><main><div class="auth-brand"><b>RI</b><h1>Regex Intelligence</h1><p>Governança e monitoria por produto</p></div><form id="login-form"><h2>Entrar no sistema</h2><label>Usuário<input id="username" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><p id="error"></p></form></main><script>document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}),x=await r.json();if(!r.ok){error.textContent=x.detail||'Falha no acesso';return}location.href=new URLSearchParams(location.search).get('next')||'/'}</script></body></html>
