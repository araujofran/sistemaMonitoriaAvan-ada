<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Trocar senha</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth">
  <main>
    <div class="auth-brand">
      <b>RI</b>
      <h1>Proteja seu acesso</h1>
      <p>A senha inicial precisa ser substituída.</p>
    </div>
    <form id="password-form">
      <h2>Definir nova senha</h2>
      <label for="new-password">Nova senha
        <input id="new-password" name="new-password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label for="password-confirmation">Confirmar senha
        <input id="password-confirmation" name="password-confirmation" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button id="save-password" type="submit">Salvar senha</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const passwordForm = document.getElementById('password-form');
    const passwordInput = document.getElementById('new-password');
    const confirmationInput = document.getElementById('password-confirmation');
    const errorMessage = document.getElementById('error');
    const saveButton = document.getElementById('save-password');

    passwordForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.textContent = '';
      if (passwordInput.value !== confirmationInput.value) {
        errorMessage.textContent = 'As senhas não coincidem.';
        confirmationInput.focus();
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = 'Salvando...';
      try {
        const response = await fetch('/api/v1/auth/change-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: passwordInput.value})
        });
        const contentType = response.headers.get('content-type') || '';
        const result = contentType.includes('application/json') ? await response.json() : {};
        if (!response.ok) {
          errorMessage.textContent = result.detail || 'Não foi possível alterar a senha.';
          return;
        }
        window.location.assign('/');
      } catch (_) {
        errorMessage.textContent = 'Não foi possível comunicar com o servidor.';
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = 'Salvar senha';
      }
    });
  </script>
</body>
</html>
